# Configuración para desarrollo en una PC (sin Raspberry Pi).
# Las rutas relativas se resuelven respecto de este archivo.
#   make dev        -> usa el simulador de Ollama (tools/mock_ollama.py)
#   make dev-real   -> usa un Ollama real en http://127.0.0.1:11434

[ollama]
url = http://127.0.0.1:11434
modelo_decision = tev1:0.8b
modelo_llm = qwen2.5:1.5b
timeout_decision = 120
timeout_llm = 240
keep_alive = 30m

[web]
host = 127.0.0.1
puerto = 8080

[datos]
db = ../../var/tickets.db
categorias = categorias.json
casos = casos_demo.json

[indicadores]
; En la PC no hay /sys/class/leds/edgeai-*: el panel muestra LEDs simulados.
habilitado = true
