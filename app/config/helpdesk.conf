# Configuración de la mesa de ayuda EdgeAI en la Raspberry Pi 4.
# Se instala en /etc/edgeai/helpdesk.conf. Tras editarla:
#   systemctl restart edgeai-helpdesk

[ollama]
url = http://127.0.0.1:11434
; Modelo de decisión System One (API JEV, endpoint /v1/systemone).
modelo_decision = tev1:0.8b
; LLM pequeño (1B-3B) para redactar respuestas en español.
modelo_llm = qwen2.5:1.5b
; Segundos. En la RPi4 todo corre en CPU: tiempos holgados.
timeout_decision = 120
timeout_llm = 240
; Mantener ambos modelos cargados en RAM para evitar recargas.
keep_alive = 24h
llm_num_ctx = 2048
llm_num_predict = 220
llm_temperatura = 0.3
; Solo para modelos con razonamiento (p. ej. qwen3): poner false. Vacío = no enviar.
llm_think =

[politica]
; Probabilidades (0-1) devueltas por el modelo de decisión.
umbral_apropiado = 0.5
umbral_alcance = 0.4
; Confianza de la categoría (1 - entropía normalizada). Debajo: revisión manual.
umbral_confianza = 0.25
umbral_autoservicio = 0.6
umbral_sensible = 0.5
; Nivel de urgencia (0=baja ... 3=crítica) a partir del cual se enciende el LED rojo.
nivel_urgente = 2

[web]
host = 0.0.0.0
puerto = 80
; Si se define, el panel y la API de atención exigen el encabezado X-Panel-Token.
panel_token =

[datos]
db = /var/lib/edgeai/tickets.db
categorias = /etc/edgeai/categorias.json
casos = /usr/share/edgeai/casos_demo.json

[indicadores]
habilitado = true
leds_dir = /sys/class/leds
led_verde = edgeai-verde
led_amarillo = edgeai-amarillo
led_rojo = edgeai-rojo
