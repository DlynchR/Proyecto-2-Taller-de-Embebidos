# Distribución EdgeAI: Poky + systemd, sin entorno gráfico.
require conf/distro/poky.conf

DISTRO = "edgeai"
DISTRO_NAME = "EdgeAI Helpdesk Linux"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "borde"
MAINTAINER = "Equipo EdgeAI - Taller de Sistemas Embebidos, TEC"

# systemd como gestor de inicio (servicios, StateDirectory, TTYPath, networkd).
INIT_MANAGER = "systemd"

DISTRO_FEATURES:append = " wifi"
# Imagen sin interfaz gráfica: el kiosco corre en la consola de texto (tty1).
DISTRO_FEATURES:remove = "x11 wayland vulkan ptest nfc 3g"

# Red con systemd-networkd y mDNS con systemd-resolved (edgeai.local).
PACKAGECONFIG:append:pn-systemd = " networkd resolved"

DEFAULT_TIMEZONE = "America/Costa_Rica"
hostname:pn-base-files = "edgeai"

# Firmware Wi-Fi/Bluetooth de la RPi4 (linux-firmware-rpidistro).
LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch"

# Overlay del kernel para los LEDs del semáforo (no viene en la lista base de meta-raspberrypi).
RPI_KERNEL_DEVICETREE_OVERLAYS:append:raspberrypi4-64 = " overlays/gpio-led.dtbo"

# Pines BCM de los LEDs (se escriben en config.txt, ver rpi-config_%.bbappend).
EDGEAI_GPIO_VERDE ??= "17"
EDGEAI_GPIO_AMARILLO ??= "27"
EDGEAI_GPIO_ROJO ??= "22"
