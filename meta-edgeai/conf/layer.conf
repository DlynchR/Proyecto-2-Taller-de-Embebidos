# Capa meta-edgeai: mesa de ayuda local con Ollama (LLM + System One/JEV)
# para Raspberry Pi 4 (aarch64).

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "edgeai"
BBFILE_PATTERN_edgeai = "^${LAYERDIR}/"
BBFILE_PRIORITY_edgeai = "10"

LAYERVERSION_edgeai = "1"
LAYERDEPENDS_edgeai = "core raspberrypi"
LAYERSERIES_COMPAT_edgeai = "wrynose"

# Raíz del repositorio. La receta edgeai-helpdesk toma el código de <repo>/app,
# así la aplicación existe una sola vez en el repositorio.
EDGEAI_REPO_DIR := "${@os.path.normpath('${LAYERDIR}/..')}"
